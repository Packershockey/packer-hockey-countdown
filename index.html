<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Packer Hockey Countdown</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#352F2C;color:#fff;text-align:center}.wrap{padding:15px 12px;max-width:720px;margin:auto}.banner{background:#5D0C0F;border-radius:6px;padding:16px 8px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px}h1{font-size:clamp(19px,4.7vw,27px);margin:8px 0 0}.event{font-weight:700;margin:18px 0 12px;font-size:17px}.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.unit{background:white;color:#5D0C0F;border-radius:5px;padding:12px 2px}.num{font-size:clamp(22px,6vw,36px);font-weight:800;font-variant-numeric:tabular-nums}.label{font-size:10px;font-weight:700;color:#352F2C;margin-top:4px}.match{font-size:clamp(16px,4vw,20px);font-weight:700;margin-top:19px}.detail{font-size:13px;margin-top:7px}.motto{font-size:11px;font-weight:700;letter-spacing:1px;border-top:1px solid #777;margin-top:18px;padding-top:13px}@media(max-width:360px){.wrap{padding:10px 7px}.clock{gap:4px}.unit{padding:10px 1px}}</style></head>
<body><main class="wrap"><header class="banner"><div class="eyebrow">SOUTH ST. PAUL PACKERS</div><h1>THE COUNTDOWN IS ON</h1></header><div id="event" class="event">2026–27 SEASON OPENER</div><div class="clock" aria-label="Time remaining"><div class="unit"><div id="days" class="num">--</div><div class="label">DAYS</div></div><div class="unit"><div id="hours" class="num">--</div><div class="label">HOURS</div></div><div class="unit"><div id="mins" class="num">--</div><div class="label">MIN</div></div><div class="unit"><div id="secs" class="num">--</div><div class="label">SEC</div></div></div><div id="match" class="match">PACKERS vs. INTERNATIONAL FALLS</div><div id="date" class="detail">FRIDAY, NOVEMBER 27 • 7:00 PM</div><div id="arena" class="detail">BRONCO ARENA</div><footer class="motto">NOTHING GIVEN. EVERYTHING EARNED.</footer></main>
<script>(()=>{const games=[{at:Date.parse('2026-11-28T01:00:00Z'),event:'2026–27 SEASON OPENER',match:'PACKERS vs. INTERNATIONAL FALLS',date:'FRIDAY, NOVEMBER 27 • 7:00 PM',arena:'BRONCO ARENA'},{at:Date.parse('2026-12-04T01:00:00Z'),event:'2026–27 HOME OPENER',match:'PACKERS vs. HASTINGS',date:'THURSDAY, DECEMBER 3 • 7:00 PM',arena:'DOUG WOOG ARENA'}];const el=id=>document.getElementById(id);const put=(id,value)=>el(id).textContent=value;function update(){const now=Date.now();const game=games.find(g=>now<g.at);if(!game){put('event','2026–27 PACKER HOCKEY');put('match','THE SEASON IS UNDERWAY!');put('date','WELCOME TO PACKER HOCKEY');put('arena','');['days','hours','mins','secs'].forEach(id=>put(id,'00'));return}['event','match','date','arena'].forEach(id=>put(id,game[id]));const s=Math.max(0,Math.floor((game.at-now)/1000));[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60].forEach((v,i)=>put(['days','hours','mins','secs'][i],String(v).padStart(2,'0')))}update();setInterval(update,1000)})();</script></body></html>
